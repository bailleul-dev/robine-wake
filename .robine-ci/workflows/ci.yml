version: 1
name: Robine Wake CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  quality:
    image: elixir@sha256:7ee41a9a8a8427dbd40c9133ee5b9047f585b58db4968fd675fbcd9498e3b22e
    shell: /bin/bash
    timeout: 20m
    env:
      MIX_ENV: test
      MIX_TARGET: host
      ERL_FLAGS: "+S 4:4"
      MAKEFLAGS: "-j4"
      C_INCLUDE_PATH: /workspace/.ci-sysroot/usr/include
      LIBRARY_PATH: /workspace/.ci-sysroot/usr/lib/x86_64-linux-gnu
      LD_LIBRARY_PATH: /workspace/.ci-sysroot/usr/lib/x86_64-linux-gnu
    steps:
      - name: Checkout
        uses: checkout
      - name: Prepare Nerves host dependency
        run: |
          mkdir -p .ci-sysroot /tmp/robine-wake-debs
          curl --fail --location --silent --show-error \
            https://deb.debian.org/debian/pool/main/libm/libmnl/libmnl0_1.0.5-3_amd64.deb \
            --output /tmp/robine-wake-debs/libmnl0.deb
          curl --fail --location --silent --show-error \
            https://deb.debian.org/debian/pool/main/libm/libmnl/libmnl-dev_1.0.5-3_amd64.deb \
            --output /tmp/robine-wake-debs/libmnl-dev.deb
          printf '%s  %s\n' \
            '4ec9c1096e0b954e3bdb03a62314ee7f49999045d3d55be3e4ded520ffc9baf5' \
            '/tmp/robine-wake-debs/libmnl0.deb' \
            '7f9a7c3f470ec400171981816df189ec86b11083c3f8d391d0800ed09a87bfc3' \
            '/tmp/robine-wake-debs/libmnl-dev.deb' | sha256sum --check
          dpkg-deb --extract /tmp/robine-wake-debs/libmnl0.deb .ci-sysroot
          dpkg-deb --extract /tmp/robine-wake-debs/libmnl-dev.deb .ci-sysroot
          rm -rf /tmp/robine-wake-debs
      - name: Prepare Mix tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap '~> 1.17' --force
          mkdir -p cover
      - name: Restore Mix cache
        uses: cache/restore
        with:
          key: robine-wake-mix-${{ checksum('mix.lock') }}
          paths: [deps]
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile without warnings
        run: mix compile --warnings-as-errors
      - name: Run Credo strict
        run: mix credo --strict
      - name: Run tests and coverage
        run: |
          set -euo pipefail

          set +e
          mix coveralls.html | tee /tmp/robine-wake-coverage.log
          coverage_status=${PIPESTATUS[0]}
          set -e

          coverage_total=$(awk '/^\[TOTAL\]/{gsub(/%/, "", $2); print $2}' /tmp/robine-wake-coverage.log | tail -1)
          if [[ -n "${coverage_total}" ]]; then
            printf 'ROBINE_COVERAGE total=%s threshold=67 report=coverage-report\n' "${coverage_total}"
          fi

          exit "${coverage_status}"
      - name: Upload coverage report
        if: always
        uses: artifacts/upload
        with:
          name: coverage-report
          paths: [cover]
          retention-days: 14
      - name: Save Mix cache
        uses: cache/save
        with:
          key: robine-wake-mix-${{ checksum('mix.lock') }}
          paths: [deps]
