[package]
name = "robine-ports"
version = "0.1.0"
edition = "2021"
publish = false
description = "Robine Wake 2 port traits (PRD-002)"

[dependencies]
robine-core = { path = "../robine-core" }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1" }
