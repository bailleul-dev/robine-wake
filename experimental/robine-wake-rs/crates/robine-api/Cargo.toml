[package]
name = "robine-api"
version = "0.1.0"
edition = "2021"
publish = false
description = "Robine Wake v1 command protocol (API-002) over the pure domain, no_std + alloc"

[features]
default = ["std"]
std = ["robine-core/std", "serde_json/std"]

[dependencies]
robine-core = { path = "../robine-core", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4"
