[package]
name = "robine-daemon"
version = "0.1.0"
edition = "2021"
publish = false
description = "Robine Wake 2 device daemon"

[[bin]]
name = "robine-wake"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures = "0.3"
libc = "0.2"
mdns-sd = "0.21.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
robine-core = { path = "../robine-core" }
robine-ports = { path = "../robine-ports" }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
