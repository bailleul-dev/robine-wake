[package]
name = "robine-airplayd"
version = "0.1.0"
edition = "2021"
publish = false
description = "AirPlay 2 receiver for the Raspberry Pi: robine-airplay core, ALSA output, driven by the Elixir app over stdin/stdout"

[dependencies]
robine-airplay = { path = "../robine-airplay", features = ["fairplay"] }
getrandom = "0.4"
libc = "0.2"
mdns-sd = "0.21.5"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
