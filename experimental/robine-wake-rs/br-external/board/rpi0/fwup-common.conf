# Robine Wake 2 — Raspberry Pi Zero 1 W layout and firmware metadata (OPS-001, PLT-005).
# Shared by fwup.conf (complete/upgrade) and fwup-ops.conf (validate/revert).

define(ROBINE_FW_PRODUCT, "Robine Wake")
define(ROBINE_FW_DESCRIPTION, "Robine Wake 2 system (Pi Zero W)")
define(ROBINE_FW_VERSION, "${ROBINE_FW_VERSION}")
define(ROBINE_FW_PLATFORM, "rpi0")
define(ROBINE_FW_ARCHITECTURE, "arm")
define(ROBINE_FW_AUTHOR, "Robine Wake")
define(ROBINE_FW_DEVPATH, "/dev/mmcblk0")

define(UBOOT_ENV_OFFSET, 16)
define(UBOOT_ENV_COUNT, 16)

define(AUTOBOOT_PART_OFFSET, 2048)
define(AUTOBOOT_PART_COUNT, 32768)
define(BOOT_A_PART_OFFSET, 34816)
define(BOOT_A_PART_COUNT, 131072)
define(BOOT_B_PART_OFFSET, 165888)
define(BOOT_B_PART_COUNT, 131072)
define(EXTENDED_PART_OFFSET, 296960)
define(ROOTFS_A_PART_OFFSET, 299008)
define(ROOTFS_A_PART_COUNT, 524288)
define(ROOTFS_B_PART_OFFSET, 825344)
define(ROOTFS_B_PART_COUNT, 524288)
define(APP_PART_OFFSET, 1351680)
define(APP_PART_COUNT, 262144)

meta-product = ${ROBINE_FW_PRODUCT}
meta-description = ${ROBINE_FW_DESCRIPTION}
meta-version = ${ROBINE_FW_VERSION}
meta-platform = ${ROBINE_FW_PLATFORM}
meta-architecture = ${ROBINE_FW_ARCHITECTURE}
meta-author = ${ROBINE_FW_AUTHOR}

mbr mbr {
    partition 0 {
        block-offset = ${AUTOBOOT_PART_OFFSET}
        block-count = ${AUTOBOOT_PART_COUNT}
        type = 0xc
        boot = true
    }
    partition 1 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = 0xc
    }
    partition 2 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = 0xc
    }
    partition 3 {
        type = 0xf
        block-offset = ${EXTENDED_PART_OFFSET}
    }
    partition 4 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
    partition 5 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
    partition 6 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83
        expand = true
    }
}

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

file-resource autoboot-a.txt {
    contents = "[all]\ntryboot_a_b=1\nboot_partition=2\n[tryboot]\nboot_partition=3\n"
}
file-resource autoboot-b.txt {
    contents = "[all]\ntryboot_a_b=1\nboot_partition=3\n[tryboot]\nboot_partition=2\n"
}
