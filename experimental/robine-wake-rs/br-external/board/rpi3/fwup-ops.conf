# Robine Wake 2 — on-device firmware operations (OPS-001).
# Built into /usr/share/fwup/ops.fw and run by robine-fw.
require-fwup-version="1.16.0"
include("${ROBINE_BOARD_DIR}/fwup-common.conf")

# Make the slot that is running now the default boot slot.
task validate.a {
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    on-resource autoboot-a.txt {
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt")
        uboot_setenv(uboot-env, "a.robine_fw_validated", "1")
    }
}
task validate.b {
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    on-resource autoboot-b.txt {
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt")
        uboot_setenv(uboot-env, "b.robine_fw_validated", "1")
    }
}
task validate.fail {
    on-init { error("Cannot detect the running slot") }
}

# Boot the other, validated slot by default from the next reboot on.
task revert.a {
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "a.robine_fw_validated", "1")
    on-resource autoboot-a.txt { fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt") }
}
task revert.b {
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "b.robine_fw_validated", "1")
    on-resource autoboot-b.txt { fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt") }
}
task revert.fail {
    on-init { error("No validated firmware in the other slot") }
}

# Erase /data: S05data formats it on the next boot (DAT-002.2).
task factory-reset {
    on-init {
        trim(${APP_PART_OFFSET}, ${APP_PART_COUNT})
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}
