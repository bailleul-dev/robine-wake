[package]
edition      = "2024"
name         = "robine-esp32"
rust-version = "1.95"
version      = "0.1.0"

description  = "Robine Wake firmware for ESP32: alarms, naps and remote button over the v1 API"

[[bin]]
name = "robine-esp32"
path = "./src/bin/main.rs"

[[bin]]
name = "strip_probe"
path = "./src/bin/strip_probe.rs"
required-features = ["esp32"]

[[bin]]
name = "breathing_demo"
path = "./src/bin/breathing_demo.rs"
required-features = ["esp32"]

[[bin]]
name = "neopixel_demo"
path = "./src/bin/neopixel_demo.rs"
required-features = ["esp32"]

[[bin]]
name = "pi_light"
path = "./src/bin/pi_light.rs"
required-features = ["esp32"]

[[bin]]
name = "sunset_demo"
path = "./src/bin/sunset_demo.rs"
required-features = ["esp32"]

[[bin]]
name = "dawn_demo"
path = "./src/bin/dawn_demo.rs"
required-features = ["esp32"]

[features]
default = ["esp32"]
# Heltec WiFi Kit 32 V1 / ESP32 DevKit: xtensa-esp32-none-elf.
esp32 = [
  "esp-hal/esp32", "esp-rtos/esp32", "esp-bootloader-esp-idf/esp32", "esp-alloc/esp32",
  "esp-backtrace/esp32", "esp-println/esp32", "esp-radio/esp32", "esp-storage/esp32",
]
# ESP32-S3-DevKitC-1 N16R8: xtensa-esp32s3-none-elf, 8 MiB octal PSRAM as heap.
esp32s3 = [
  "esp-hal/esp32s3","esp-rtos/esp32s3", "esp-bootloader-esp-idf/esp32s3",
  "esp-alloc/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3", "esp-radio/esp32s3",
  "esp-storage/esp32s3",
]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "multicast",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = [
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

chrono       = { version = "0.4", default-features = false, features = ["alloc"] }
embassy-sync = "0.8.0"
esp-storage  = "0.10.0"
edge-mdns        = { version = "0.8.0", default-features = false, features = ["io"] }
edge-nal         = "0.7"
edge-nal-embassy = "0.9"
libm             = "0.2"
rand_core        = { version = "0.10", default-features = false }
robine-airplay   = { path = "../../crates/robine-airplay", features = ["fairplay"] }
robine-api   = { path = "../../crates/robine-api", default-features = false }
robine-core  = { path = "../../crates/robine-core", default-features = false }
serde_json   = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
flate2 = "1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# Standalone: built with the Xtensa toolchain, outside the host workspace.
[workspace]
