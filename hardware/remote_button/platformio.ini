[platformio]
default_envs = heltec-wifi-kit-32

[env:heltec-wifi-kit-32]
platform = espressif32@6.10.0
board = heltec_wifi_kit_32
framework = arduino
extra_scripts = pre:scripts/env_config.py
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  olikraus/U8g2@2.36.18
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D STOP_BUTTON_PIN=0
