# Avahi only advertises the AirPlay 2 receiver. The device host name itself
# (robine-wake.local) is answered by the application's own mDNS responder, so
# Avahi uses a distinct name and tolerates the other stack on port 5353.
[server]
host-name=robine-wake-airplay
use-ipv4=yes
use-ipv6=yes
disallow-other-stacks=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=yes
