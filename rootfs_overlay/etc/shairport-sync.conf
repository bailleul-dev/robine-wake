general =
{
  name = "Robine Wake Bedroom";
  output_backend = "alsa";
  mdns_backend = "avahi";
  interpolation = "auto";
  // AirPlay volume runs from -30.0 (0 %) to 0.0 (100 %): -7.5 opens at 75 %.
  default_airplay_volume = -7.5;
  high_threshold_airplay_volume = -3.0;
  high_volume_idle_timeout_in_minutes = 60;
};

sessioncontrol =
{
  allow_session_interruption = "yes";
  session_timeout = 60; // Shairport Sync 5 requires 0 or at least 60
};

// No mixer control: AirPlay volume is applied in software, in 32-bit, below
// the Amp2 "Digital" level that RobineWake.Audio keeps at the music ceiling
// (music_mixer_db). Only wake audio may change that hardware level.
alsa =
{
  output_device = "plughw:0";
  output_format = "S32_LE";
  disable_standby_mode = "never";
};

metadata =
{
  enabled = "no";
  include_cover_art = "no";
};
