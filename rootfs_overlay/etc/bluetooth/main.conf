# BlueZ policy for the Bluetooth A2DP music receiver.
#
# The onboard controller is attached to the kernel stack through hci_uart.
# Pairing is intentionally open (no button, no PIN); the pairing agent run by
# RobineWake.BluetoothAudio accepts every request. See
# docs/specs/30/005-bluetooth-audio-receiver/spec.md.

[General]
Name = Robine Wake Bedroom
# Audio/Video major class, Loudspeaker minor class.
Class = 0x000414
ControllerMode = bredr
DiscoverableTimeout = 0
AlwaysPairable = true
PairableTimeout = 0
JustWorksRepairing = always
FastConnectable = true

[Policy]
AutoEnable = true
ReconnectAttempts = 0
